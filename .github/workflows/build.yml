name: Compilar APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Compilar APK (assembleDebug)
        run: gradle assembleDebug --stacktrace

      - name: Subir APK a Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WLED-Luces-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar Release con APK descargable
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "WLED Luces App v1.0.0"
          body: "Descarga el archivo app-debug.apk directamente en tu celular Android e instálalo."
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
