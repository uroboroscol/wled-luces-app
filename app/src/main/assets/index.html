500, 3000], "hat": [3000, 10000]}, "groove": ["ocean_waves", "zen", "aurora", "respira", "olas", "ambiente", "voz", "voz_centro", "voz_laser", "corazon", "estrellas"], "break": ["ocean_waves", "zen", "aurora", "respira", "olas", "ambiente", "voz", "voz_centro", "voz_laser", "corazon", "estrellas", "solido"], "paletas": ["sangre", "rojo_violeta", "sunset", "deep_sea", "forest", "ocean", "lavender", "hielo", "aurora_boreal", "galaxia", "rojo_morado", "morado_rojo", "neon_vampire", "dark_sith"]}};

let S = {
  auto: false, efecto: 'voz_centro', paleta: 'techno', genero: 'techno',
  brillo: 0.9, sens: 2.0, frase: 8, div: 4, estrobo_auto: true, chispas: true,
  paleta_drop: true, offset: 0, invertir: false, hold: null, rotar_paleta: true,
  drop_compases: 2, drop_max: 16, adelanto: 70, apagon: 1.0, rnd_t: 8,
  ip: '192.168.40.16', leds: 150, conectado: true,
  generos: GENEROS_DATA
};

let L = { bpm: 128, beat: 0, volumen: 0, tension: 0, lock: 0, espectro: [], actual: 'voz_centro' };
const $ = id => document.getElementById(id);

function set(o) {
  Object.assign(S, o);
  if (window.AndroidBridge && window.AndroidBridge.set) {
    window.AndroidBridge.set(JSON.stringify(o));
  }
}

function trigger(e) {
  set({ evento: e });
}

// Generar barras FFT
const fftContainer = $('fft_bars');
if (fftContainer) {
  fftContainer.innerHTML = '';
  for (let i = 0; i < 16; i++) {
    const b = document.createElement('div');
    b.className = 'fft-bar';
    b.id = 'fft_' + i;
    fftContainer.appendChild(b);
  }
}

function mk_btn(id, g) {
  if (!ALL_FX[id]) return;
  const [n, d] = ALL_FX[id];
  const b = document.createElement('button');
  b.className = 'fx';
  b.id = 'fx_' + id;
  b.innerHTML = n + '<small>' + d + '</small>';
  b.onclick = () => {
    if (!S.auto && S.efecto == id) {
      S.auto = true; set({ auto: true });
    } else {
      S.auto = false; S.efecto = id; set({ efecto: id, auto: false });
    }
    pintar();
  };
  $(g).append(b);
}

function renderGrid(g) {
  const cfg = S.generos[g] || S.generos['techno'];
  $('g1').innerHTML = '';
  $('g2').innerHTML = '';
  $('pal').innerHTML = '';

  cfg.groove.forEach(id => mk_btn(id, 'g1'));
  cfg.break.forEach(id => mk_btn(id, 'g2'));

  // Botón Aleatoria
  const br = document.createElement('button');
  br.dataset.p = 'aleatoria';
  br.innerHTML = '<span style="background:linear-gradient(90deg,#ff1744,#00e5ff,#7c00ff)"></span><div>🎲 Aleatoria</div>';
  br.onclick = () => {
    S.paleta = 'aleatoria';
    set({ paleta: 'aleatoria' });
    pintar();
  };
  $('pal').appendChild(br);

  cfg.paletas.forEach(p => {
    if (!window.PAL[p]) return;
    const c = window.PAL[p].map(x => 'rgb(' + x + ')');
    const b = document.createElement('button');
    b.dataset.p = p;
    b.innerHTML = '<span style="background:linear-gradient(90deg,' + c.join(',') + ')"></span><div>' + p + '</div>';
    b.onclick = () => {
      S.paleta = p;
      set({ paleta: p });
      pintar();
    };
    $('pal').append(b);
  });
}

function mk_g3(list, g) {
  $('g3').innerHTML = '';
  list.forEach(([id, n, d]) => {
    const b = document.createElement('button');
    b.className = 'fx';
    b.id = 'fx_' + id;
    b.innerHTML = n + '<small>' + d + '</small>';
    b.onclick = () => {
      if (!S.auto && S.efecto == id) {
        S.auto = true; set({ auto: true });
      } else {
        S.auto = false; S.efecto = id; set({ efecto: id, auto: false });
      }
      pintar();
    };
    $(g).append(b);
  });
}
mk_g3(G3, 'g3');

// Botones de Género
document.querySelectorAll('.genre-btn').forEach(btn => {
  btn.onclick = () => {
    const g = btn.dataset.g;
    S.genero = g;
    set({ genero: g });
    document.querySelectorAll('.genre-btn').forEach(b => b.classList.toggle('on', b.dataset.g == g));
    renderGrid(g);
    pintar();
  };
});

$('auto').onclick = () => { S.auto = !S.auto; set({ auto: S.auto }); pintar(); };

// Pads
function hold(id, v) {
  const b = $('p_' + id);
  if (!b) return;
  const on = () => set({ hold: v }), off = () => set({ hold: null });
  b.onpointerdown = on; b.onpointerup = off; b.onpointerleave = off; b.onpointercancel = off;
  b.oncontextmenu = e => e.preventDefault();
}
hold('strobe', 'strobe'); hold('blinder', 'blinder'); hold('blackout', 'blackout'); hold('flash', 'flash');
$('p_drop').onclick = () => set({ evento: 'drop' });
$('p_tap').onclick = () => set({ evento: 'tap' });

$('t_kick').onclick = () => trigger('test_kick');
$('t_hat').onclick = () => trigger('test_hat');
$('t_drop').onclick = () => trigger('drop');
$('t_tap').onclick = () => trigger('tap');

// Modal de Conexión
$('btn_conn').onclick = () => {
  $('cfg_ip').value = S.ip;
  $('cfg_leds').value = S.leds;
  $('conn_modal').classList.add('open');
};
$('m_close').onclick = () => $('conn_modal').classList.remove('open');

$('btn_do_connect').onclick = () => {
  const ip = $('cfg_ip').value.trim();
  const leds = parseInt($('cfg_leds').value.trim()) || 150;
  if (!ip) return alert('Ingresa una dirección IP válida');
  S.ip = ip; S.leds = leds; S.conectado = true;
  if (window.AndroidBridge && window.AndroidBridge.connect) {
    window.AndroidBridge.connect(ip, leds);
  }
  $('hdr_info').textContent = 'WLED ' + ip + ' (' + leds + ' LEDs)';
  $('conn_dot').classList.remove('off');
  $('conn_txt').textContent = 'Conectado';
  $('conn_modal').classList.remove('open');
};

$('btn_do_disconnect').onclick = () => {
  S.conectado = false;
  if (window.AndroidBridge && window.AndroidBridge.disconnect) {
    window.AndroidBridge.disconnect();
  }
  $('conn_dot').classList.add('off');
  $('conn_txt').textContent = 'Desconectado';
  $('conn_modal').classList.remove('open');
};

// Sliders y opciones
['brillo', 'sens', 'offset', 'adelanto'].forEach(k => {
  const el = $(k);
  if (el) {
    el.oninput = () => {
      $(k + '_v').textContent = el.value + (k === 'brillo' ? '' : k === 'sens' ? 'x' : '');
      set({ [k]: parseFloat(el.value) });
    };
  }
});

['frase', 'div', 'drop_compases', 'drop_max'].forEach(k => {
  const el = $(k);
  if (el) el.onchange = () => set({ [k]: parseInt(el.value) });
});

if ($('apagon')) $('apagon').onchange = () => set({ apagon: parseFloat($('apagon').value) });

['estrobo_auto', 'chispas', 'paleta_drop', 'rotar_paleta', 'invertir'].forEach(k => {
  const el = $(k);
  if (el) el.onchange = () => set({ [k]: el.checked });
});

if ($('rnd_t')) {
  $('rnd_t').oninput = () => {
    let v = parseInt($('rnd_t').value) || 8;
    S.paleta = 'aleatoria';
    set({ rnd_t: v, paleta: 'aleatoria' });
    pintar();
  };
}

function pintar() {
  $('auto').classList.toggle('on', S.auto);
  $('auto').textContent = S.auto ? 'AUTO VJ · ACTIVO' : 'AUTO VJ · MANUAL';
  document.querySelectorAll('.fx').forEach(b => b.classList.toggle('on', !S.auto && b.id == 'fx_' + S.efecto));
  document.querySelectorAll('.pal button').forEach(b => b.classList.toggle('on', b.dataset.p == S.paleta));
  document.querySelectorAll('.genre-btn').forEach(b => b.classList.toggle('on', b.dataset.g == (S.genero || 'techno')));
}

// 2D Canvas Room
const roomCanvas = $('room');
const roomCtx = roomCanvas ? roomCanvas.getContext('2d') : null;

function drawRoom(beat, volumen) {
  if (!roomCtx) return;
  const w = roomCanvas.width, h = roomCanvas.height;
  roomCtx.fillStyle = '#0a0a10';
  roomCtx.fillRect(0, 0, w, h);

  // Paredes cuadradas representando la habitación de LEDs
  roomCtx.strokeStyle = beat ? '#ff1744' : '#00e5ff';
  roomCtx.lineWidth = 4 + volumen * 6;
  roomCtx.strokeRect(20, 20, w - 40, h - 40);

  // Pulso central
  roomCtx.beginPath();
  roomCtx.arc(w / 2, h / 2, 10 + volumen * 40, 0, Math.PI * 2);
  roomCtx.fillStyle = beat ? '#ff174488' : '#00e5ff44';
  roomCtx.fill();
}

// Transmisión en vivo desde Android
window.onLiveStream = function(d) {
  if (!d) return;
  L = d;
  if ($('bpm')) $('bpm').textContent = Math.round(d.bpm || 128);
  if ($('now')) $('now').textContent = ALL_FX[d.efecto] ? ALL_FX[d.efecto][0] : d.efecto;
  if ($('vu_val')) $('vu_val').style.width = Math.min(100, Math.round((d.volumen || 0) * 100)) + '%';
  if ($('ten_val')) $('ten_val').style.width = Math.min(100, Math.round((d.vocal || 0) * 100)) + '%';

  // Dots de ritmo
  document.querySelectorAll('.dots i').forEach((x, i) => x.classList.toggle('on', i === d.beat));

  // FFT Bars
  if (d.espectro) {
    for (let i = 0; i < 16 && i < d.espectro.length; i++) {
      const b = $('fft_' + i);
      if (b) b.style.height = Math.max(8, Math.round(d.espectro[i] * 100)) + '%';
    }
  }

  drawRoom(d.kick, d.volumen);
};

// Inicialización desde AndroidBridge
function init() {
  if (window.AndroidBridge && window.AndroidBridge.getState) {
    try {
      const st = JSON.parse(window.AndroidBridge.getState());
      Object.assign(S, st);
    } catch (e) {}
  }
  $('hdr_info').textContent = 'WLED ' + S.ip + ' (' + S.leds + ' LEDs)';
  if ($('brillo')) { $('brillo').value = S.brillo; $('brillo_v').textContent = S.brillo; }
  if ($('sens')) { $('sens').value = S.sens; $('sens_v').textContent = S.sens + 'x'; }
  if ($('rnd_t')) $('rnd_t').value = S.rnd_t;

  renderGrid(S.genero || 'techno');
  pintar();
}

init();
</script>
